<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8">
    <link rel="stylesheet" href="./style.css">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Pen</title>
  </head>
  <body>

    <header>
     <div> 매일 커피 </div>
     <nav>
      <ul>
       <li><a href="#hero"> 메뉴 </a></li>
       <li><a href="#special"> 스페셜 </a></li>
       <li><a href="#ask"> 문의하기 </a></li>
      </ul>
     </nav>
    </header>

    <main>
    <section id="hero">
    <h1> 메뉴 </h1>
    <p> 오늘 아침 갓 내린 커피를 향긋하게 즐겨 보세요. </p>

    <img src="https://encrypted-tbn0.gstatic.com/images?q=tbn:ANd9GcT17OEhHi80D6UcY5_fk1pv-t6Og2TFASALKzWWSiscrA&s=10">
    </section>

    <section id="special">
    <h3> 스페셜 </h3>
    <ul>
      <li> 아라비카 원두 커피 </li>
      <li> 인도네시아 만델리 커피 </li>
      <li> 하와이 코나 커피 </li>
    </ul>
    </section>

  <section id="ask">
    <h3> 문의하기 </h3>
    <form action="#" method="get">
     <span> 이름 </span>
     <input type="text" name="name"> <br>
     <span> 전화번호 </span>
     <input type="tel" name="phone"> <br>
     <span> 문의 내용 </span>
     <textarea name="question">
     </textarea> <br>
    <input type="submit">
    </form>
    
  </section>

    </main>

    <footer>
    <h5> 공지사항 </h5>
    <ul>
      <li> 회사 소개 </li>
      <li> 인재 채용 </li>
      <li> 개인정보 보호 정책 </li>
    </ul>
      </footer>
    
  </body>
</html>
